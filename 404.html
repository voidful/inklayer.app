<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#243B35">
  <meta name="description" content="InkLayer: handwriting, PDFs and Markdown notes on one canvas, in files you own.">
  <title>InkLayer</title>
  <link rel="icon" href="/icon.png">
  <style>
    :root {
      color-scheme: light dark;
      --background: #f4f6f1;
      --surface: #ffffff;
      --text: #202521;
      --muted: #5d6860;
      --accent: #2f7558;
      --border: #9aa49b;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0b1115;
        --surface: #111a1f;
        --text: #f4f6f1;
        --muted: #b3bdb4;
        --accent: #69c49b;
        --border: #435049;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 32px 20px;
    }

    main {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin: 0 auto;
      max-width: 860px;
      padding: 28px;
    }

    img {
      border-radius: 8px;
      height: 56px;
      width: 56px;
    }

    h1 {
      font-size: 32px;
      line-height: 1.15;
      margin: 18px 0 8px;
    }

    h2 {
      font-size: 20px;
      margin: 28px 0 10px;
    }

    p,
    li {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    a {
      color: var(--accent);
      font-weight: 700;
    }

    .notice {
      border-left: 4px solid var(--accent);
      margin: 22px 0;
      padding: 10px 14px;
    }

    .language-links {
      display: flex;
      gap: 14px;
      margin: 18px 0 0;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icon.png" alt="InkLayer">
    <h1>Page not found</h1>
    <p>This page does not exist. <a href="/">InkLayer home</a> · <a href="/privacy/">Privacy Policy</a> · <a href="/support/">Support</a></p>
  </main>
</body>
</html>
